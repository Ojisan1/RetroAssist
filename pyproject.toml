[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retroassist"
version = "0.1.0a1"
description = "Local-first workbench assistant for classic electronics repair"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ojisan1" },
]
keywords = ["electronics", "repair", "vintage", "multimodal", "local-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
retroassist = "retroassist.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retroassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
